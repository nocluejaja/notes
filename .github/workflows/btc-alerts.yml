name: BTC alerts
on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: btc-alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check BTC and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ inputs.test && '1' || '0' }}
        run: node alerts/check.mjs
      - name: Save alert state
        run: |
          if [ -n "$(git status --porcelain alerts/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add alerts/state.json alerts/market.json
            git commit -m "Update BTC alert state [skip ci]"
            git push
          fi
